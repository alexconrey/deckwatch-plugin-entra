[package]
name = "deckwatch-plugin-entra"
version = "0.1.0"
edition = "2021"
description = "Deckwatch plugin — provisions Microsoft Entra enterprise applications and maps SSO values to Kubernetes Ingress annotations"
repository = "https://github.com/alexconrey/deckwatch-plugin-entra"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckwatch-plugin-sdk = { git = "https://github.com/alexconrey/deckwatch-plugin-sdk", tag = "v0.10.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# extism-pdk only links on WASM — its host functions don't exist on native targets.
# Tests run on the host and must not link against it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"
